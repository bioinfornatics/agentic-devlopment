version: "1.0.0"
title: "Beads-Native Controlled Engineering Loop"
description: "Run a bounded Trigger-to-Controller engineering loop with Beads as the durable control plane."
instructions: |
  ## AD-001 pattern: Orchestration
  The current session is the controller. Load skills task-framing, load skills evidence-verification, and load skills loop-control in-session. Delegate all specialist execution to isolated repository-researcher, change-builder, and independent-verifier sessions through Summon. Never load a specialist agent into the controller session.

  Beads is the sole durable runtime state. Do not create or read .loop state. Git/CI keep source and proof artifacts; Beads keeps the run graph, state, assignments, chronology, and evidence references.

  First visible output before tools:
    Objective: <objective>
    Run: <run_id or NEW>
    Budget: <max_iterations> iterations, <max_no_progress> no-progress
    Next gate: Trigger authorization and Beads state recovery

  Execute the generic graph in docs/loop-engineering/diagrams:
  Trigger -> Planner -> Builder -> Independent Verifier -> Memory -> Manager -> Controller.

  Invocation boundary and authoritative guard:
     - One invocation processes zero or one ready build task. If a build is delegated, run exactly one fresh independent verification, then Memory, Manager, and Controller inline, persist exactly one transition, return, and exit. Never select a second build task. The scheduler or user may resume later from Beads.
     - On resume, load counters and budgets from run metadata. Parameters are creation defaults only; never reset persisted loop_iteration, loop_no_progress_count, limits, rework/failure/evidence state, due_at, or transition state.
     - Before delegation and immediately before persisting the Controller transition, assemble {snapshot, now} from current durable bd show <id> --json fields plus an explicit UTC instant from date -u +%Y-%m-%dT%H:%M:%SZ, then call node src/app/harness-manager/dist/loop-transition-guard.js on stdin and parse its JSON. Include requested transition, iteration/no-progress counters and limits, rework_count, failure signatures/repetition, changed_evidence, due_at, external dependency/resume condition, next_task, and expected_proof.
     - A guard result with allowed=false is authoritative: do not delegate or replace its transition/reason. A malformed input, nonzero exit, or malformed output safely ABORTs. WAIT persists its resume condition and exits without polling, sleeping, dependency retries, or delegation.

  1. Trigger
     - If run_id is supplied, load and validate that Beads epic.
     - Otherwise search open loop-engineering epics for the same objective/external reference; deduplicate before creating.
     - Create a run epic only when no compatible run exists. For that new run only, store objective, global ACs, spec ID, budgets, loop_iteration=0, loop_no_progress_count=0, loop_transition=CONTINUE, and execution_mode=orchestrated. Existing durable counters always win over parameter defaults.
     - Use bd set-state for phase=trigger and persist START, WAIT, or REJECT rationale.

  2. Planner
     - Load task-framing and reconstruct spec, prior attempts, evidence signatures, blocked/ready work, and remaining budget.
     - Ask phase inquiry: required tools/skills; required falsifying checks; relevant Beads facts/decisions; prior failures; implementation/tests/config/dependencies/evidence added afterward; whether those additions can change the verdict.
     - Delegate repository-researcher only for material unknowns. Parallelize read-only research by disjoint question when useful, then synthesize conflicts.
     - Create only the next bounded Beads child tasks and explicit dependencies. Parallel tasks require no dependency edge and disjoint write sets.

  Delegation runtime:
     - Use Summon for bounded one-shot delegates and parallel read-only research.
     - Use Orchestrator sessions when a bounded rework cycle benefits from retained specialist context; record every session ID in Beads and still use a fresh verifier.

  3. Builder
     - Select at most one ready child task, ensure blockers are closed, identify expected proof, request the applicable CONTINUE/REWORK/REPLAN decision, and run the authoritative guard before delegation. With no ready task, skip Builder and Verifier and continue once to the inline stages.
     - Delegate only when the pre-delegation guard returns allowed=true, and delegate only that task to change-builder.
     - Check task metadata for rework_count. If rework_count >= 4, do not delegate; emit ABORT with reason "premium builder exhausted after rework_count attempts — no agent tier remaining". If rework_count >= 2, delegate to change-builder-premium instead of change-builder. Record the escalation and rework_count in a Beads comment.
     - The builder claims before writing and records builder_session, candidate evidence, changed files, and evidence signature in Beads.
     - Never let two builders own the same file. Retry only with a changed hypothesis or materially new evidence.

  4. Independent verifier  [HAR-01: gated verification requires env:reviewed]
     - Only after the one build finishes, create/select a verification child depending on it. Run one fresh verification; never verify stale evidence or start another build/verify increment.
     - Check task metadata for rework_count. If rework_count >= 2, delegate to independent-verifier-premium instead of independent-verifier. Record the escalation in a Beads comment.
     - Delegate independent-verifier in a fresh isolated session; verifier_session must differ from builder_session.
     - The verifier does not repair files. It persists criterion evidence and exactly one verdict: ACCEPTED, REWORK, REPLAN, BLOCKED, or ESCALATE.
     - Gated verification (COMPLETE transition) requires env:reviewed label on the Beads task being verified; a task without env:reviewed is not eligible for COMPLETE.

  5. Memory
     - Persist concise current state, chronology, durable facts, decisions, evidence/artifact references, conflicts, and reusable lessons in Beads comments/events/metadata.
     - Increment loop_iteration exactly once only after an applicable Builder plus fresh Verifier increment completes. Denial, early stop, WAIT, or zero-task invocation does not increment it. After a completed increment, increment loop_no_progress_count for no measurable progress or reset it to zero for measurable progress; otherwise leave it unchanged.
     - Never store raw prompts, secrets, chain-of-thought, or large command output.

  6. Manager
     - Inspect ready/blocked children and WIP. Measure newly proven ACs, newly unblocked tasks, reduced unknowns, and materially new evidence.
     - Detect repeated failure/evidence signatures. Select no work when continuation is not justified.

  7. Controller
     - Load loop-control. Evaluate verdict, global AC coverage, progress, dependencies, permissions, risk, and remaining iteration/time budget.
     - Choose one requested transition, rebuild the snapshot from just-persisted durable Beads fields with a fresh explicit UTC time, and call node src/app/harness-manager/dist/loop-transition-guard.js immediately before persistence. Its returned decision, including a denied stop transition/reason, is final and authoritative.
     - Emit and persist exactly one transition: CONTINUE, REWORK, REPLAN, WAIT, COMPLETE, ESCALATE, or ABORT. It must be the guard-returned transition; never persist an intermediate transition.
     - CONTINUE/REWORK/REPLAN requires one next Beads task, expected proof, and remaining budget.
     - WAIT blocks/defers with an exact resume condition; do not poll.
     - COMPLETE requires independent proof for every global AC and closes the run with evidence. CONTINUE, REWORK, and REPLAN persist the one justified next task/proof and still exit; they never loop internally.
     - ESCALATE names the exact human decision/action. ABORT records impossibility, guardrail, exhausted budget, or repeated no-progress.
     - Never continue by default. Stop after the same failure twice without new evidence or two consecutive zero-progress iterations.
     - Escalation ceiling: rework_count 0–1 uses change-builder (standard), rework_count 2–3 uses change-builder-premium (inherits session model), rework_count >= 4 triggers ABORT — no further builder tier exists.

  All phase handoffs must survive context replacement because the authoritative state is in Beads.

  Skill contract for every delegate: propagate the role's mandatory baseline skill names and any objective-driven dynamic skill candidates from task metadata, the governing spec, repository instructions, the objective, risks, and proof needs. Require loading by name only and only when materially relevant; never preload all skills. Require selected names and concise rationale in Beads and the handoff. A missing mandatory skill blocks the role; a missing optional or dynamic skill is documented and blocks or escalates only when the objective cannot still be completed safely and proved. Preserve the delegate's freedom of method inside scope, acceptance criteria, and guardrails.
prompt: |
  Execute a Beads-native controlled engineering loop for:
  {{ objective }}

  Existing run (optional): {{ run_id }}
  Governing specification (optional): {{ spec_id }}
  Maximum iterations: {{ max_iterations }}
  Maximum consecutive no-progress iterations: {{ max_no_progress }}
parameters:
  - key: objective
    input_type: string
    requirement: required
    description: "Engineering objective to achieve"
  - key: run_id
    input_type: string
    requirement: optional
    default: ""
    description: "Existing Beads run epic to resume"
  - key: spec_id
    input_type: string
    requirement: optional
    default: ""
    description: "Governing specification path"
  - key: max_iterations
    input_type: number
    requirement: optional
    default: "8"
    description: "Hard iteration budget"
  - key: max_no_progress
    input_type: number
    requirement: optional
    default: "2"
    description: "Hard consecutive no-progress budget"
extensions:
  - type: platform
    name: summon
  - type: platform
    name: orchestrator
  - type: platform
    name: skills
  - type: builtin
    name: developer
retry:
  max_retries: 3
  checks:
    - type: shell
      command: "test -f .beads/issues.jsonl"
    - type: shell
      command: "jq -Rce 'select(length > 0) | fromjson' .beads/issues.jsonl >/dev/null  # Beads JSONL integrity"
  on_failure: abort
session:
  max_tool_repetitions: 5
settings:
  max_turns: 80
response:
  json_schema:
    type: object
    properties:
      run_id: {type: string}
      status:
        type: string
        enum: [CONTINUE, REWORK, REPLAN, WAIT, COMPLETE, ESCALATE, ABORT]
      summary: {type: string}
      iterations: {type: number}
      final_transition: {type: string}
      evidence_refs:
        type: array
        items: {type: string}
      remaining_risks:
        type: array
        items: {type: string}
      resume_condition:
        type: [string, "null"]
    required: [run_id, status, summary, iterations, final_transition, evidence_refs, remaining_risks]
