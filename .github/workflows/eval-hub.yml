---
name: Eval Hub

"on":
  pull_request:
    paths:
      - "src/app/**"
      - ".github/workflows/eval-hub.yml"
  push:
    branches: [main]
    paths:
      - "src/app/**"
      - ".github/workflows/eval-hub.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Just 1.55.1
        uses: extractions/setup-just@v3
        with:
          just-version: "1.55.1"

      - name: Read Node version
        id: node-version
        shell: bash
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Bun for runtime projection
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: pnpm
          cache-dependency-path: src/app/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild Eval Hub native dependency
        run: pnpm --filter @harness/eval-hub rebuild better-sqlite3

      - name: Bootstrap projected harness runtime
        working-directory: ${{ github.workspace }}
        run: just bootstrap-runtime

      - name: Check native binding
        run: pnpm --filter @harness/eval-hub test:native

      - name: Typecheck
        run: pnpm --filter @harness/eval-hub typecheck

      - name: Build
        run: pnpm --filter @harness/eval-hub build

      - name: Deterministic corpus and impact checks (no LLM)
        run: pnpm --filter @harness/eval-hub exec vitest run causalDeps impactSelector
        working-directory: ${{ github.workspace }}

      - name: Test
        run: pnpm --filter @harness/eval-hub test