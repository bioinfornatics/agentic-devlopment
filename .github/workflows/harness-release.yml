name: Harness Release
on:
  pull_request:
    paths: ["src/harness/**", "src/agents/**", "src/skills/**", "src/recipes/**", "src/plugins/**", "src/app/**", "docs/specs/**", "docs/adr/**", ".github/workflows/harness-release.yml"]
  workflow_dispatch:
    inputs:
      evaluation_run_id:
        description: "Run ID containing evaluation-attestation artifact (required for tag publication)"
        required: true
        type: string
      release_tag:
        description: "Existing harness-v* tag to publish"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}"}
      - name: Install Just 1.55.1
        uses: extractions/setup-just@v3
        with: {just-version: "1.55.1"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: pnpm/action-setup@v4
        with: {version: "10.33.0"}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - name: Install workspace dependencies
        run: pnpm --dir src/app install --frozen-lockfile --ignore-scripts
      - name: Rebuild Eval Hub native dependencies
        run: pnpm --dir src/app --filter @harness/eval-hub rebuild better-sqlite3
      - run: pnpm --dir src/app --filter @harness/eval-hub build
      - name: Bootstrap projected harness runtime
        run: just bootstrap-runtime
      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ "${{ inputs.release_tag }}" == harness-v* ]] || { echo "release_tag must match harness-v*" >&2; exit 2; }
            version="${{ inputs.release_tag }}"; version="${version#harness-v}"
          else
            version="0.0.0-pr${{ github.event.pull_request.number || github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download independently produced evaluation attestation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: evaluation-attestation
          path: dist/evaluation-attestation
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evaluation_run_id }}
      - name: Build reproducible pull-request candidate (proof optional, never publishes)
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: node src/app/harness-release/dist/ci-harness-release.js --version "${{ steps.release-version.outputs.version }}" --output dist/harness-ci --dry-run-publish --skip-tests
      - name: Build candidate and fail closed on current attestation
        if: github.event_name == 'workflow_dispatch'
        run: node src/app/harness-release/dist/ci-harness-release.js --version "${{ steps.release-version.outputs.version }}" --output dist/harness-ci --attestation dist/evaluation-attestation/attestation.json --bindings dist/evaluation-attestation/bindings.json --profile dist/evaluation-attestation/profile.json --skip-tests
      - name: Verify candidate installation through harness manager
        run: |
          prefix="$(mktemp -d)"
          node src/app/harness-manager/dist/install-harness-release.js install --bundle dist/harness-ci/release --prefix "$prefix"
          node src/app/harness-manager/dist/install-harness-release.js verify --prefix "$prefix"
      - name: Build Eval Hub optional companion
        if: github.event_name == 'workflow_dispatch'
        run: just VERSION="${{ steps.release-version.outputs.version }}" OUTPUT=dist/eval-hub-companion SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" package-companion
      - uses: actions/upload-artifact@v4
        with: {name: harness-release-linux-x86_64, path: dist/harness-ci/release/**}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with: {name: eval-hub-companion-linux-x86_64, path: dist/eval-hub-companion/**}
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: harness-release-linux-x86_64, path: release}
      - uses: actions/download-artifact@v4
        with: {name: eval-hub-companion-linux-x86_64, path: companion}
      - run: gh release create "${{ inputs.release_tag }}" release/* companion/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}