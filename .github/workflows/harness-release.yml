name: Harness Release
on:
  pull_request:
    paths: ["harness/**", ".agents/**", ".goose/recipes/**", "scripts/**", "evals/**", ".github/workflows/harness-release.yml"]
  push:
    tags: ["harness-v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: pnpm/action-setup@v4
        with: {version: "10.33.0"}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pnpm --dir apps install --frozen-lockfile
      - run: pnpm --dir apps --filter @harness/eval-hub build
      - run: python3 scripts/ci-harness-release.py --version "${GITHUB_REF_NAME#harness-v}" --output dist/harness-ci --dry-run-publish
      - name: Build Eval Hub optional companion
        run: python3 scripts/package-eval-hub-companion.py --version "${GITHUB_REF_NAME#harness-v}" --output dist/eval-hub-companion --license-spdx "${{ vars.EVAL_HUB_LICENSE_SPDX }}" --source-date-epoch "$(git show -s --format=%ct HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-release-linux-x86_64
          path: dist/harness-ci/release/**
      - uses: actions/upload-artifact@v4
        with:
          name: eval-hub-companion-linux-x86_64
          path: dist/eval-hub-companion/**
  publish:
    if: startsWith(github.ref, 'refs/tags/harness-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: harness-release-linux-x86_64, path: release}
      - uses: actions/download-artifact@v4
        with: {name: eval-hub-companion-linux-x86_64, path: companion}
      - run: gh release create "$GITHUB_REF_NAME" release/* companion/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
