name: Harness Release
on:
  pull_request:
    paths: ["harness/**", ".agents/**", ".goose/recipes/**", "companions/**", "apps/eval-hub/**", "scripts/**", "evals/**", "docs/specs/**", "docs/adr/**", ".github/workflows/harness-release.yml"]
  push:
    tags: ["harness-v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: pnpm/action-setup@v4
        with: {version: "10.33.0"}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.3.12"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install Python test dependencies
        run: python -m pip install --requirement requirements-ci.txt
      - name: Install workspace dependencies
        run: pnpm --dir apps install --frozen-lockfile --ignore-scripts
      - name: Rebuild Eval Hub native dependencies
        run: pnpm --dir apps --filter @harness/eval-hub rebuild better-sqlite3
      - run: pnpm --dir apps --filter @harness/eval-hub build
      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/harness-v* ]]; then
            version="${GITHUB_REF_NAME#harness-v}"
          else
            version="0.0.0-pr${{ github.event.pull_request.number || github.run_number }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python3 scripts/ci-harness-release.py --version "${{ steps.release-version.outputs.version }}" --output dist/harness-ci --dry-run-publish --skip-tests
      - name: Build Eval Hub optional companion
        if: startsWith(github.ref, 'refs/tags/harness-v')
        run: make -f companions/eval-hub/Makefile --no-print-directory package VERSION="${{ steps.release-version.outputs.version }}" OUTPUT=dist/eval-hub-companion LICENSE_SPDX="${{ vars.EVAL_HUB_LICENSE_SPDX }}" SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: harness-release-linux-x86_64
          path: dist/harness-ci/release/**
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/harness-v')
        with:
          name: eval-hub-companion-linux-x86_64
          path: dist/eval-hub-companion/**
  publish:
    if: startsWith(github.ref, 'refs/tags/harness-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: harness-release-linux-x86_64, path: release}
      - uses: actions/download-artifact@v4
        with: {name: eval-hub-companion-linux-x86_64, path: companion}
      - run: gh release create "$GITHUB_REF_NAME" release/* companion/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
