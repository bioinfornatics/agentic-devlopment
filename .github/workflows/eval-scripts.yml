---
name: Harness tooling tests

"on":
  pull_request:
    paths:
      - "src/app/harness-release/**
      - "src/app/harness-manager/**""
      - "src/app/package.json"
      - "src/app/pnpm-lock.yaml"
      - "src/app/pnpm-workspace.yaml"
      - ".github/workflows/eval-scripts.yml"
  push:
    branches: [main]
    paths:
      - "src/app/harness-release/**
      - "src/app/harness-manager/**""
      - "src/app/package.json"
      - "src/app/pnpm-lock.yaml"
      - "src/app/pnpm-workspace.yaml"
      - ".github/workflows/eval-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: TypeScript and Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"
      - name: Install workspace dependencies
        run: pnpm --dir src/app install --frozen-lockfile --ignore-scripts
      - name: Type-check tooling
        run: pnpm --dir src/app --filter @harness/harness-release typecheck
      - run: pnpm --dir src/app --filter @harness/harness-manager typecheck
      - name: Run tooling tests
        run: pnpm --dir src/app --filter @harness/harness-release test
      - run: pnpm --dir src/app --filter @harness/harness-manager test
