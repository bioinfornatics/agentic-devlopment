version: "1.0.0"
title: "Claimed Bounded Implementation"
description: "Implement one ready Beads child task in an isolated builder session and produce candidate evidence."
instructions: |
  ## AD-001 pattern: Specialist orchestration boundary
  Delegate to change-builder in an isolated session. Load skill task-framing before delegation. Do not perform implementation in the recipe controller.

  First visible output before tools:
    Run/task: <run_id>/<task_id>
    Builder: isolated, claim-before-write
    Completion authority: independent verifier

  Load the Beads task and confirm it is ready, blockers are closed, contract/ACs/proof/budget are complete, and no other builder owns its files. Ask which tools/skills/checks are required, what failed previously, and what material evidence changed afterward.

  The delegated builder must atomically claim the task before any write, record builder_session, implement only the contract, update proportional tests, run declared checks, and persist compact candidate evidence references. If scope is invalid return REPLAN; if a dependency is unavailable return BLOCKED/WAIT; if permission or human judgment is required return ESCALATE. Never set ACCEPTED or COMPLETE.
prompt: |
  Implement Beads task {{ task_id }} in run {{ run_id }}.
  Additional controller context: {{ context }}
parameters:
  - key: run_id
    input_type: string
    requirement: required
    description: "Parent Beads run epic"
  - key: task_id
    input_type: string
    requirement: required
    description: "Ready bounded Beads build task"
  - key: context
    input_type: string
    requirement: optional
    default: ""
    description: "Additional bounded controller context"
extensions:
  - type: platform
    name: summon
  - type: platform
    name: skills
  - type: builtin
    name: developer
retry:
  max_retries: 3
  checks:
    - type: shell
      command: "test -f .beads/issues.jsonl"
    - type: shell
      command: "cd apps/eval-hub && npx tsc --noEmit 2>/dev/null"
  on_failure: abort
session:
  max_tool_repetitions: 5
settings:
  max_turns: 35
